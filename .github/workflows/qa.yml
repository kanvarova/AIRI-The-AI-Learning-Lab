name: AIRI QA audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run QA self-check
        run: node qa/audit.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check qa/audit.mjs
          node --check qa/serve.mjs

